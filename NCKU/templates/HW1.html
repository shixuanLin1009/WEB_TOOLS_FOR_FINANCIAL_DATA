<!DOCTYPE html>
<html lang="en">
  {% extends "base.html" %}
  <!-- {% block title %} HW3 {% endblock %}  -->
  {% block content %} {% load static %}

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/HW1.css' %}" />
  </head>
  <body>
    <div id="container_input">
      <h3>爆大量！</h3>
      <form id="inductorForm" onsubmit="return false;">
        <div class="row">
          <div class="col">
            <label for="stockInductor" class="form-label">股票代號</label>
            <input
              type="text"
              class="form-control form-control-lg"
              id="stockInductor"
              placeholder="AAPL"
            />
          </div>
          <div class="col">
            <label for="d_num" class="form-label">期數</label>
            <input
              type="number"
              class="form-control form-control-lg"
              id="d_num"
              placeholder="5"
            />
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="startDateInductor" class="form-label">起始日期</label>
            <input
              type="date"
              class="form-control form-control-lg"
              id="startDateInductor"
              placeholder="2021-01-01"
            />
          </div>
          <div class="col">
            <label for="endDateInductor" class="form-label">結束日期</label>
            <input
              type="date"
              class="form-control form-control-lg"
              id="endDateInductor"
              placeholder="2021-12-31"
            />
          </div>
        </div>

        <button type="submit" id="submitButton" class="btn btn-secondary">
          Submit
        </button>
      </form>
    </div>
    <div class="chart_div">
      <!-- 圖片部分 -->
      <script src="https://code.highcharts.com/stock/highstock.js"></script>
      <script src="https://code.highcharts.com/stock/modules/exporting.js"></script>
      <script src="https://code.highcharts.com/modules/accessibility.js"></script>

      <div id="container"></div>
    </div>
    <!-- table 的部分 -->
    <div class="table-container">
      <table id="highVolumeTable" class="display" style="width: 100%">
        <thead>
          <tr>
            <th>Date</th>
            <th>High Volume</th>
            <th>Five Day MA</th>
          </tr>
        </thead>
        <tbody>
          <!-- 表格數據將由 JavaScript 動態生成 -->
        </tbody>
      </table>
    </div>
    <script src="{% static 'js/HW1.js' %}"></script>
  </body>

  {% endblock %}
</html>
